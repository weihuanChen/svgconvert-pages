# Cloudflare Workers Configuration (API Routes)
# 
# This Worker handles:
# 1. Queue Consumer: Processing SVG conversion tasks
# 2. Cron Trigger: Cleaning up expired files every 30 minutes
# 3. Direct access to Cloudflare resources (R2, D1, KV, Queue)
#
# Deploy: wrangler deploy -c wrangler.workers.toml
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "svg-converter-api"
compatibility_date = "2024-01-01"

# Entry point for the Worker
main = "src/worker.ts"

# ============================================================================
# Account Configuration
# ============================================================================

account_id = "916a9ebd0967327020ed90ad654875f6"
workers_dev = true

# Route patterns (for production deployment)
# Uncomment and configure when deploying to production
# routes = [
#   { pattern = "svgconvert.net/api/*", zone_name = "svgconvert.net" }
# ]

# ============================================================================
# R2 Bucket Bindings
# ============================================================================

[[r2_buckets]]
binding = "SVG_CONVERTER_BUCKET"
bucket_name = "svgconvert-net"
preview_bucket_name = "svgconvert-net-preview"

# ============================================================================
# D1 Database Bindings
# ============================================================================

[[d1_databases]]
binding = "SVG_CONVERTER_DB"
database_name = "svg-converter"
database_id = "6762c777-6807-438c-801e-e3f743aa6a5e"
preview_database_id = "6762c777-6807-438c-801e-e3f743aa6a5e"

# ============================================================================
# KV Namespace Bindings
# ============================================================================

[[kv_namespaces]]
binding = "SVG_CONVERTER_KV"
id = "d6f9b75693384b869b13edae0a84f485"
preview_id = "ecc92269f04f49b49f6bbf2d106e0993"

# ============================================================================
# Queue Bindings
# ============================================================================

[[queues.producers]]
binding = "SVG_CONVERTER_QUEUE"
queue = "svg-converter-queue"

[[queues.consumers]]
queue = "svg-converter-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "svg-converter-dlq"

# ============================================================================
# Environment Variables
# ============================================================================

[vars]
R2_PUBLIC_URL = "https://pub-62d5cc9053a54840a2075d357d13940e.r2.dev"
VPS_CONVERSION_URL = "https://svgconvert-server.zeabur.app/api/convert"
MAX_FILE_SIZE = "20971520"  # 20MB
FILE_RETENTION_MINUTES = "30"
R2_ACCOUNT_ID = "916a9ebd0967327020ed90ad654875f6"
ENVIRONMENT = "production"

# ============================================================================
# Deployment Configuration
# ============================================================================

# Cron triggers for cleanup tasks (Workers only)
[triggers]
crons = ["0 */1 * * *"]

# ============================================================================
# Observability (Workers only)
# ============================================================================

[observability]
enabled = true

# ============================================================================
# Notes
# ============================================================================

# Deploy Workers API:
#   wrangler deploy -c wrangler.workers.toml
#
# Deploy Pages frontend:
#   wrangler pages deploy .next --project-name=svg-converter

