# Cloudflare Pages Configuration for Next.js
# Using @cloudflare/next-on-pages
# Documentation: https://developers.cloudflare.com/pages/platform/build-configuration/
#
# NOTE: Build configuration must be set in Cloudflare Pages dashboard:
#   Build command: npm run pages:build
#   Build output directory: .vercel/output/static

name = "svg-converter"
compatibility_date = "2025-11-11"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# ============================================================================
# Environment Variables (Available to frontend)
# ============================================================================

[vars]
R2_PUBLIC_URL = "https://pub-bf3c9ba2f1304bd08d48ee78c54b9a14.r2.dev"
MAX_FILE_SIZE = "20971520"  # 20MB
FILE_RETENTION_MINUTES = "30"
R2_ACCOUNT_ID = "916a9ebd0967327020ed90ad654875f6"
ENVIRONMENT = "production"
NEXT_PUBLIC_API_BASE_URL = "https://svgconvert-server.zeabur.app/api"
NEXT_PUBLIC_APP_URL = "https://svgconvert-server.zeabur.app"

# ============================================================================
# Production Environment (Pages only supports: preview, production)
# ============================================================================

[env.production.vars]
ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://pub-62d5cc9053a54840a2075d357d13940e.r2.dev"
MAX_FILE_SIZE = "20971520"
FILE_RETENTION_MINUTES = "30"
R2_ACCOUNT_ID = "916a9ebd0967327020ed90ad654875f6"
NEXT_PUBLIC_API_BASE_URL = "https://svgconvert-server.zeabur.app/api"
NEXT_PUBLIC_APP_URL = "https://svgconvert-server.zeabur.app"

[env.preview.vars]
ENVIRONMENT = "preview"
R2_PUBLIC_URL = "https://pub-bf3c9ba2f1304bd08d48ee78c54b9a14.r2.dev"
MAX_FILE_SIZE = "20971520"
FILE_RETENTION_MINUTES = "30"
R2_ACCOUNT_ID = "916a9ebd0967327020ed90ad654875f6"
NEXT_PUBLIC_API_BASE_URL = "https://svgconvert-server.zeabur.app/api"
